name: trainarr

services:
  app:
    container_name: trainarr
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Toutes les variables (DATABASE_URL, clés IA, identifiants WebDAV)
    # viennent de .env — jamais du repo.
    env_file: .env
    environment:
      # Le code fixe déjà le fuseau de l'athlète (src/config/time.ts) ; ceci
      # aligne aussi les logs et tout code tiers sur la même heure locale.
      TZ: ${TZ:-Europe/Paris}
      # Fixé ici et non dans .env : le chemin doit coïncider avec le point de
      # montage ci-dessous, et compose est le seul à connaître les deux. Un seul
      # container applicatif : c'est ce process-ci qui dépose (WebDAV sur /dav),
      # scanne et ingère (cf. src/instrumentation.ts).
      FIT_INBOX_DIR: /data/fit-inbox
    volumes:
      - trainarr-fit-inbox:/data/fit-inbox
    ports:
      # Port hôte paramétrable : sur le réseau app-staging, les autres services
      # (reverse proxy, Komodo) joignent le container sur 3000 quoi qu'il arrive.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      # Le serveur ne démarre qu'une fois le schéma à jour. Une migration en échec
      # bloque le déploiement au lieu de servir l'appli sur une base incohérente.
      migrate:
        condition: service_completed_successfully
    networks:
      - app-staging

  # Prépare le déploiement puis sort : propriété du volume d'import, migrations
  # Drizzle. Service dédié plutôt qu'un `migrate && node server.js` dans le
  # container applicatif : le build standalone n'expose pas drizzle-orm sous forme
  # de package installable (il est bundlé dans les chunks de l'app), l'image de
  # runtime reste donc minimale, et la migration tourne une fois par déploiement —
  # pas à chaque redémarrage du serveur.
  migrate:
    container_name: trainarr-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    # One-shot : ne pas relancer un container qui a terminé son travail.
    restart: "no"
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Paris}
    # Monté uniquement pour le chown ci-dessous : ce container-ci n'écrit aucun FIT.
    volumes:
      - trainarr-fit-inbox:/data/fit-inbox
    # Le `chown` du Dockerfile ne couvre qu'un volume nommé **neuf** : Docker n'en
    # recopie la propriété qu'à l'initialisation. Sur un volume déjà créé (toute
    # mise à jour du stack), le répertoire reste à root et l'appli, qui tourne en
    # uid 1001, part en EACCES sur chaque PUT WebDAV comme sur chaque scan. Ce
    # service-ci tourne en root et s'achève avant `app` : c'est le seul endroit
    # d'où la correction est déterministe. Le chown est idempotent et instantané
    # sur quelques fichiers.
    command:
      - sh
      - -c
      - chown -R 1001:1001 /data/fit-inbox && exec node_modules/.bin/tsx src/data/db/migrate.ts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-staging

  db:
    container_name: trainarr-db
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainarr}
      # La base est jointe au réseau partagé app-staging : tout container de ce
      # réseau peut l'atteindre. Renseigner un vrai mot de passe dans .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-trainarr}
    volumes:
      - trainarr-db-data:/var/lib/postgresql/data
    # Non exposé sur l'hôte : seul le réseau interne y accède.
    # Décommenter pour inspecter la base depuis la machine hôte (psql, drizzle-kit).
    # ports: ["5432:5432"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trainarr} -d ${POSTGRES_DB:-trainarr}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-staging

volumes:
  trainarr-db-data:
  # Boîte de dépôt des fichiers FIT. Un seul service applicatif la monte : `app`
  # y écrit (point WebDAV /dav, cf. src/lib/fit/dav.ts), la scanne et range les
  # fichiers ingérés dans processed/ ou failed/ (src/lib/fit/service.ts).
  # `migrate` la monte aussi, le temps d'en fixer la propriété à l'uid 1001 sous
  # lequel `app` tourne.
  trainarr-fit-inbox:

networks:
  # Réseau partagé du homelab, géré hors de ce stack (Komodo).
  # À créer une seule fois s'il n'existe pas : docker network create app-staging
  app-staging:
    external: true
